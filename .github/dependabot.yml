version: 2
updates:
  # Keep all Gradle dependencies up to date in one single PR
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    groups:
      all-gradle-updates:
        patterns:
          - "*"

  # Keep all GitHub Actions up to date in one single PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions-updates:
        patterns:
          - "*"